<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notion Timer</title>
<style>
:root{color-scheme:light dark;font-family:Inter,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:transparent;color:light-dark(#222,#eee)}main{max-width:460px;margin:auto;padding:14px;text-align:center}.clock{font-variant-numeric:tabular-nums;font-size:clamp(48px,10vw,76px);font-weight:650;letter-spacing:-.05em}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}button,input{font:inherit}button{padding:9px 16px;border-radius:10px;cursor:pointer;border:1px solid light-dark(#dadada,#555);background:light-dark(#f6f6f6,#262626);color:inherit}button.primary{background:#2383e2;color:white;border-color:#2383e2}input{width:72px;text-align:center;padding:7px;border:1px solid light-dark(#ccc,#555);border-radius:8px;background:transparent;color:inherit}.bar{height:5px;margin-top:12px;border-radius:5px;background:light-dark(#e9e9e9,#444);overflow:hidden}.fill{height:100%;width:100%;background:#2383e2;transition:width .15s linear}.caption{font-size:12px;color:light-dark(#666,#aaa);margin-top:10px}label{font-size:13px}
</style>
</head>
<body><main>
<div class="clock" id="clock" role="timer" aria-live="off">10:00</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div class="controls"><label for="minutes">Dakika</label><input id="minutes" type="number" min="1" max="999" step="1" value="10"><button id="start" class="primary">Başlat</button><button id="reset">Sıfırla</button></div>
<div class="caption" id="status">Hazır</div>
</main>
<script>
(()=>{'use strict';const params=new URLSearchParams(location.search);const initial=Math.max(1,Math.min(999,Number(params.get('minutes'))||10));const $=id=>document.getElementById(id);const clock=$('clock'),fill=$('fill'),minutes=$('minutes'),start=$('start'),reset=$('reset'),status=$('status');minutes.value=initial;
let duration=initial*60000,remaining=duration,endAt=0,running=false,finished=false;let audio=null;
function render(){const secs=Math.ceil(Math.max(0,remaining)/1000);clock.textContent=`${Math.floor(secs/60).toString().padStart(2,'0')}:${(secs%60).toString().padStart(2,'0')}`;fill.style.width=`${Math.max(0,Math.min(100,remaining/duration*100))}%`;start.textContent=running?'Duraklat':remaining===0?'Yeniden başlat':finished?'Yeniden başlat':'Başlat';minutes.disabled=running}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=880;gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.12,audio.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.4);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.42)}catch(e){}}
function tick(){if(!running)return;remaining=Math.max(0,endAt-Date.now());if(remaining===0){running=false;finished=true;status.textContent='Süre doldu';beep()}render()}
function configure(){const n=Math.max(1,Math.min(999,Math.round(Number(minutes.value)||10)));minutes.value=n;duration=n*60000;remaining=duration;finished=false;status.textContent='Hazır';render()}
minutes.addEventListener('change',()=>{if(!running)configure()});start.addEventListener('click',()=>{if(running){tick();if(running){running=false;status.textContent='Duraklatıldı'}render();return}if(remaining===0)configure();if(!audio){try{const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}catch(e){}}if(audio)audio.resume().catch(()=>{});running=true;endAt=Date.now()+remaining;status.textContent='Çalışıyor';render()});reset.addEventListener('click',()=>{running=false;configure()});setInterval(tick,200);document.addEventListener('visibilitychange',tick);render();
})();
</script></body></html>
